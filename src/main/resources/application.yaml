spring:
  application:
    name: langapp
  datasource:
    url: jdbc:postgresql://localhost:5432/langapp
    username: ${USER_POSTGRE}
    password: ${PASSWORD_POSTGRE}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update